  <body>
    <div class="stage">
      <h1 class="site-title">
        <span class="sac">Sac</span><span class="passport">Passport</span>
      </h1>
      <section class="hero" aria-label="Routes into Sacramento">
        <div id="globe"></div>
        <p id="globe-fallback" class="globe-fallback" hidden>
          The globe did not start. The event cards below still work.
        </p>
      </section>
    </div>

    <main class="wrap">
      <h2 class="question">Where would you like to staycation?</h2>

      <div class="sorts" role="group" aria-label="Sort cultures">
        <button type="button" data-sort="upcoming" aria-pressed="true">Upcoming</button>
        <button type="button" data-sort="name" aria-pressed="false">A–Z</button>
        <button type="button" class="cultures-menu-btn" aria-label="All cultures" aria-haspopup="dialog">
          <span class="hamburger" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
        <a
          class="ig-btn"
          href="https://www.instagram.com/sacpassport/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram @sacpassport"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">

              fill="currentColor"

            />
          </svg>
        </a>
      </div>

      <div id="cards" class="cards"></div>

      <footer class="site-footer">
        <p>
          Want to add yours? Post your flier to
          <a
            href="https://www.facebook.com/groups/459990582020176"
            target="_blank"
            rel="noopener noreferrer"
          >Sac. Event &amp; Group Announcements</a>
          Facebook Group
        </p>
      </footer>
    </main>
