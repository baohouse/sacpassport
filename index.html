<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      gtag('config', 'G-QKCWDS4NJG');

    <meta property="og:title" content="SacPassport" />
    <meta
      property="og:description"
      content="Where would you like to staycation?"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/baohouse/sacpassport/main/public/og.png"
    />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="501" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/baohouse/sacpassport/main/public/og.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,500;1,500&family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />

  <body>
    <div class="stage">
      <h1 class="site-title">
        <span class="sac">Sac</span><span class="passport">Passport</span>
      </h1>
      <section class="hero" aria-label="Routes into Sacramento">
        <div id="globe"></div>
        <p id="globe-fallback" class="globe-fallback" hidden>
          The globe did not start. The event cards below still work.
        </p>
      </section>
    </div>

    <main class="wrap">
      <h2 class="question">Where would you like to staycation?</h2>

      <div class="sorts" role="group" aria-label="Sort cultures">
        <button type="button" data-sort="upcoming" aria-pressed="true">Upcoming</button>
        <button type="button" data-sort="name" aria-pressed="false">A–Z</button>
        <button type="button" class="cultures-menu-btn" aria-label="All cultures" aria-haspopup="dialog">
          <span class="hamburger" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
        </button>
      </div>

      <div id="cards" class="cards"></div>

      <footer class="site-footer">
        <p>
          Want to add yours? Post your flier to
          <a
            href="https://www.facebook.com/groups/459990582020176"
            target="_blank"
            rel="noopener noreferrer"
          >Sac. Event &amp; Group Announcements</a>
          Facebook Group
        </p>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
